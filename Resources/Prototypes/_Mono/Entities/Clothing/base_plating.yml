- type: entity
  abstract: true
  id: ClothingArmorPlate
  components:
  - type: ArmorPlateHolder
    # HardLight start: Replaced plate storage with a dedicated plate slot.
    plateSlot:
      whitelist:
        components:
        - ArmorPlateItem
    # HardLight end
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container
        showEnts: False
        occludes: True
        ents: []

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlateLight
  components:
  - type: ArmorPlateHolder # HardLight
    plateSlot:
      startingItem: ArmorPlateLight

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlateMedium
  components:
  - type: ArmorPlateHolder # HardLight
    plateSlot:
      startingItem: ArmorPlateMedium

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlateTactical
  components:
  - type: ArmorPlateHolder # HardLight
    plateSlot:
      startingItem: ArmorPlateTactical

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlatePlastitanium
  components:
  - type: ArmorPlateHolder # HardLight
    plateSlot:
      startingItem: ArmorPlatePlastitanium
