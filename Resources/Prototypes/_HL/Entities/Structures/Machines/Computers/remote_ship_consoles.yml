  name: harbormaster's remote tug console
  description: Remotely controls the station's harbor tug. Useful for remotely enforcing docking law, towing offenders away from the station, or assissting in enforcing a port lockdown. Does not include weapon control.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
