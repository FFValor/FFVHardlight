  id: ClothingOuterEVASuitTesting1
  name: Testing suit engineering
  description: Testing
  components:
  - type: Sprite
    sprite: _HL/Clothing/OuterClothing/Hardsuits/assessor_exosuit.rsi
  - type: Clothing
    sprite: _HL/Clothing/OuterClothing/Hardsuits/assessor_exosuit.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitAssessor
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot
  - type: AccessReader
    access: [['Engineering']]

