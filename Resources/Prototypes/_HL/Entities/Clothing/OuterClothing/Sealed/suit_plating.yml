# Plate prototypes



# Combat plates

- type: entity
  parent: BaseItem
  id: ArmorPlateLightDurathread
  name: light durathread plate
  description: A lightweight protective plate made from tough woven durathread. Capable of stopping small arms fire, but provides very little protection otherwise.
  suffix: Combat
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_light.rsi
    state: icon
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_light.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 25
    walkSpeedModifier: 0.94
    sprintSpeedModifier: 0.94
    staminaDamageMultiplier: 1.0
    absorptionRatios:
      Blunt: 0.05
      Slash: 0.05
      Piercing: 1
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - PlatingCombat

- type: entity
  parent: BaseItem
  id: ArmorPlateHeavyDurathread
  name: heavy durathread plate
  description: A bulky protective plate made from layers oftough woven durathread. Capable of stopping heavy arms fire, but provides very little protection otherwise.
  suffix: Combat
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_light.rsi
    state: icon
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_light.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 50
    walkSpeedModifier: 0.84
    sprintSpeedModifier: 0.84
    staminaDamageMultiplier: 1.0
    damageMultipliers:
      Piercing: 0.5
    absorptionRatios:
      Blunt: 0.15
      Slash: 0.15
      Piercing: 1
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - PlatingCombat

