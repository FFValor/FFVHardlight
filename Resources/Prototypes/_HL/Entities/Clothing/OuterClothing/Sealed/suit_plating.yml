- type: entity
  abstract: true
  id: ClothingArmorPlate
  components:
  - type: ArmorPlateHolder
    plateSlot:
      whitelist:
        components:
        - ArmorPlateItem
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container
        showEnts: False
        occludes: True
        ents: []

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlateCombat
  components:
  - type: ArmorPlateHolder
    plateSlot:
      whitelist:
        tags:
        - PlatingCombat
        components:
        - ArmorPlateItem
        requireAll: true
      startingItem: ArmorPlateHeavyDurathread

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlateMedical
  components:
  - type: ArmorPlateHolder
    plateSlot:
      whitelist:
        tags:
        - PlatingMedical
        components:
        - ArmorPlateItem
        requireAll: true
      startingItem: ArmorPlateSterile

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlateEngineering
  components:
  - type: ArmorPlateHolder
    plateSlot:
      whitelist:
        tags:
        - PlatingEngineering
        components:
