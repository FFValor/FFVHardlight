  - type: Clothing
    sprite: _NF/Clothing/OuterClothing/Suits/goblin_eva_robes.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadEVAHelmetGoblin
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot
  - type: Lock
  - type: ItemSlotsLock
    slots:
