# Wearable Gieger Counter, Atmos Scanner, and T-Ray Scanner

# Wearable Binocular Enhancing, toggleable. -Restricted to head/mask/goggles, for obvious, eye related reasons.

# Inhalant Mask, functionally a reusable easily customizable cigarette. -Restricted to mask slots, to avoid stacking.

# HUD elements, not toggleable. -# Do not stack multiple parents to create omni-HUDs -# Restricted to helmets, for balancing around HUD stacking.
