# Suit Assistant Slot, Allows inserting of certain sized mechanical ghostroles, enables sharing bodily control. -Restricted to outer clothing that feasibly has the ability to move the wearer's body.

# Wearable Anomaly Scanners, toggleable. high and low power versions.

