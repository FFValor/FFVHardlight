# This file is separate from other base clothing files as it's more intended for examples of how to use and balance certain abilities, rather than as a global base. Also to enforce my evil agenda through comments (IE, balancing concerns)
# I'll try to keep all examples explained, and still usable for prototyping, but some may be more for demonstration purposes, and not intended to be used as is. I'll try to mark those clearly.

# Reactors. The replacement for speed boots, intended (and encouraged to use for) niche outer equipment slot items -Keep away from combat equipment.
- type: entity
  parent: PowerCellSlotSmallItem
  id: ClothingOuterReactorBase
  name: reactor base item
  description: How are you seeing this?
  components:
  - type: ToggleClothing
    action: ActionToggleSuitAbility
  - type: ToggleableClothingSpeedModifier # New component!, treat it as where you define whatever your gear's normal, inactive slowdown will be.
    activatedWalkModifier: 1.7 # These two are where you define the active speed boost, balance power draw accordingly.
    activatedSprintModifier: 1.7
    deactivatedWalkModifier: 0.5 # These two functionally replace the basic speed modifier component.
    deactivatedSprintModifier: 0.5
  - type: PowerCellDraw
    drawRate: 40 # The funny number you'll wanna play with a ton when balancing the speed boost.
  - type: ToggleCellDraw
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist:
          tags:
          - RechargeableCell # This is where we blacklist self recharging type cells, because FUCK infinite power :3 # Seriously, these are balanced around limited usage and power economy, self-recharging cells ruin that.

- type: entity
  parent: ClothingOuterReactorBase
  id: ClothingOuterReactorLow
  name: low reactor base item
  description: How are you seeing this?
  components:
  - type: ToggleableClothingSpeedModifier
    activatedWalkModifier: 1.20
    activatedSprintModifier: 1.20
    deactivatedWalkModifier: 0.95
    deactivatedSprintModifier: 0.95
  - type: PowerCellDraw
    drawRate: 9 # two full minutes of a small speed boost, balanced with a high cap cell's 1080

- type: entity
  parent: ClothingOuterReactorBase
  id: ClothingOuterReactorMedium
  name: medium reactor base item
  description: How are you seeing this?
  components:
  - type: ToggleableClothingSpeedModifier
    activatedWalkModifier: 1.40
    activatedSprintModifier: 1.40
    deactivatedWalkModifier: 0.95
    deactivatedSprintModifier: 0.95
  - type: PowerCellDraw
    drawRate: 18 # One full minute of a medium speed boost, balanced with a high cap cell's 1080

- type: entity
  parent: ClothingOuterReactorBase
  id: ClothingOuterReactorHigh
  name: High reactor base item
  description: How are you seeing this?
  components:
  - type: ToggleableClothingSpeedModifier
    activatedWalkModifier: 1.6
    activatedSprintModifier: 1.6
    deactivatedWalkModifier: 0.95
    deactivatedSprintModifier: 0.95
  - type: PowerCellDraw
    drawRate: 36 # 30 seconds of a massive speed boost, balanced with a high cap cell's 1080

# Wearable Anomaly Scanners, toggleable. high and low power versions.
- type: entity
  id: WearableAnomalyLocatorNarrow
  parent: [PowerCellSlotSmallItem, BaseItem]
  name: Short locator base item
  description: How are you seeing this?
  components:
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Ambience/Objects/light_hum.ogg
      params:
        volume: -10
        maxDistance: 1
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: /Audio/Weapons/click.ogg
      params:
        maxDistance: 1
  - type: ToggleCellDraw
  - type: PowerCellDraw
    drawRate: 1.2
    useRate: 0
  - type: ProximityBeeper
  - type: ProximityDetector
    range: 20 # The base locator is 20, and the wide is 40
    criteria:
      components:
      - Anomaly
  - type: Beeper
    isMuted: true
    minBeepInterval: 0.15
    maxBeepInterval: 1.00
    beepSound:
      path: "/Audio/Items/locator_beep.ogg"
      params:
        maxDistance: 1
        volume: -8
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist:
          tags:
          - RechargeableCell # Again, blacklisting rechargers.

- type: entity
  id: WearableAnomalyLocatorWide
  parent: WearableAnomalyLocatorNarrow
  name: Wide locator base item
  description: How are you seeing this?
  components:
  - type: ProximityDetector
    range: 40 # The base locator is 20, and the wide is 40
    criteria:
      components:
      - Anomaly

# Wearable Ore Scanners, toggleable
- type: entity
  id: WearableMineralScannerBase
  parent: [PowerCellSlotSmallItem, BaseItem]
  name: wearable mineral scanner
  description: A scanner HUD that overlays information about nearby ore deposits.
  components:
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Ambience/Objects/light_hum.ogg
      params:
        volume: -10
        maxDistance: 1
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: /Audio/Weapons/click.ogg
      params:
        maxDistance: 1
  - type: ToggleCellDraw
  - type: PowerCellDraw
    drawRate: 2.4 # ~5 minutes on a medium power cell.
    useRate: 0
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist:
          tags:
          - RechargeableCell # We get the pattern yet?
  - type: MiningScanner

- type: entity
  id: WearableAdvancedMineralScannerBase
  parent: WearableMineralScannerBase
  name: wearable mineral scanner
  description: A high quality scanner HUD that overlays information about nearby ore deposits. Features a much higher range.
  components:
  - type: PowerCellDraw
    drawRate: 1.2 # ~10 minutes on a medium power cell.
    useRate: 0
  - type: MiningScanner
    range: 10

# Wearable Gieger Counter, Atmos Scanner, and T-Ray Scanner

- type: entity
  parent: BaseItem
  id: WearableGeigerCounter
  name: wearable geiger counter
  description: A handheld device used for detecting and measuring radiation pulses.
  components:
  - type: Geiger
    showControl: true
    showExamine: true
    broadcastAudio: true

# Active Zoom Effect. -Restricted to head/mask/goggles, for obvious, eye related reasons.

- type: entity
  id: WearableZoomBase
  parent: [PowerCellSlotSmallItem, BaseToggleClothing, BaseItem]
  name: zoom HUD
  description: A scanner HUD that enhances vision definition.
  components:
  - type: EyeCursorOffset
    maxOffset: 5
    pvsIncrease: 0.5

# Welding Blinders, toggled but requires no power.

- type: entity
  id: ClothingHeadToggledFlashLenses
  parent: [BaseToggleClothing, BaseItem]
  name: flash lenses
  description: a simple set of non-reactive welding lenses. Only work when activated and blocking vision, but grants full immunity to welding arcs or flashes.
  components:
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: /Audio/Weapons/click.ogg
      params:
        maxDistance: 1
  - type: ToggleClothing
    action: ActionToggleFlashLenses
  - type: WeldingMask
  - type: ComponentToggler
    components:
    - type: FlashImmunity
    - type: EyeProtection
    - type: VisionDarkener
      strength: 6

