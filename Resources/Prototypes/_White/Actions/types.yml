- type: entity
  id: ToggleNVHud
  name: Toggle Night Vision
  description: Toggles night vision.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    priority: -20
    useDelay: 1
    icon:
      sprite: _White/Clothing/Eyes/Goggles/nightvision.rsi
      state: icon
    event: !type:ToggleNVHudEvent

- type: entity
  id: ToggleIRHud
  name: Toggle Thermal Vision
  description: Toggles thermal vision.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    priority: -20
    useDelay: 1
    icon:
      sprite: _White/Clothing/Eyes/Goggles/thermal.rsi
      state: icon
    event: !type:ToggleIRHudEvent

- type: entity
  id: PulseIRHud
  parent: ToggleIRHud
  name: Pulse Thermal Vision
  description: Activate thermal vision temporarily.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 4
