# Night Vision Goggles

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesNVHudGoggles
  name: night vision goggles
  description: Now you can see in the dark!
  components:
  - type: Sprite
    sprite: _White/Clothing/Eyes/Goggles/nightvision.rsi
  - type: Clothing
    sprite: _White/Clothing/Eyes/Goggles/nightvision.rsi
  - type: NVHud
    flashDurationMultiplier: 2
    isEquipment: true
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: ClothingEyesNVHudGoggles
  id: ClothingEyesNVHudGogglesSyndie
  suffix: "Chameleon"
  components:
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: ChameleonClothing
    slot: [eyes]
    default: ClothingEyesGlassesSunglasses
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

- type: entity
  parent: ClothingEyesNVHudGogglesSyndie
  id: ClothingEyesNVHudGogglesNukie
  suffix: "Chameleon, NukeOps"
  components:
  - type: ShowSyndicateIcons
  - type: ShowJobIcons
  - type: ShowMindShieldIcons

# Thermal Vision Goggles

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesIRHudGoggles
  name: thermal vision goggles
  description: Now you can see everyone!
  components:
  - type: Sprite
    sprite: _White/Clothing/Eyes/Goggles/thermal.rsi
  - type: Clothing
    sprite: _White/Clothing/Eyes/Goggles/thermal.rsi
  - type: IRHud
    flashDurationMultiplier: 2
    pulseTime: 2
    isEquipment: true
    toggleAction: PulseIRHud
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: ClothingEyesIRHudGoggles
  id: ClothingEyesIRHudGogglesSyndie
  suffix: "Chameleon"
  components:
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: ChameleonClothing
    slot: [eyes]
    default: ClothingEyesGlassesSunglasses
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

- type: entity
  parent: ClothingEyesIRHudGogglesSyndie
  id: ClothingEyesIRHudGogglesNukie
  suffix: "Chameleon, NukeOps"
  components:
  - type: ShowSyndicateIcons
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
